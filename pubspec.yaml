name: ai_fitness_health_tracker
description: Flutter mobil uygulaması PostgreSQL ile
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.2

  # API & HTTP
  dio: ^5.3.0
  http: ^1.1.0

  # State Management
  provider: ^6.0.0
  geolocator: ^9.0.0
  google_maps_flutter: ^2.9.0
  location: ^5.0.0
  intl: ^0.19.0

  # JSON Serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.11.0

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Image Cache
  cached_network_image: ^3.3.0

  # UI
  shimmer: ^3.0.0

  # Logging
  logger: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  json_serializable: ^6.0.0
  build_runner: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/
